<style>
@font-face{font-family:'Pretendard Variable';src:url(./assets/PretendardVariable.woff2) format('woff2-variations'),url(./assets/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-display:swap}
:root{
  /* 내안의연뮤 Design System 토큰 (Figma 변수 기준) */
  --neutral-0:#FFFFFF;--neutral-100:#F8F7F9;--neutral-200:#EAE9EC;--neutral-300:#D6D5D8;--neutral-400:#C2C1C4;--neutral-500:#A4A3A6;--neutral-600:#7C7B7E;--neutral-700:#5E5D60;--neutral-900:#2C2B2E;
  --brand-100:#F7EFFF;--brand-200:#E6D5F9;--brand-400:#D7A6FF;--brand-500:#B086F0;--brand-600:#9A6BE3;
  --text-primary:#272727;--text-tertiary:#7C7B7E;--text-brand:#9A6BE3;
  --border-selection:#B086F0;--border-divider:#D6D5D8;
  --status-danger:#FA6363;--blue-500:#709FF6;--yellow-500:#FFCA42;
  --sb:54px;--hb:44px;--hb34:34px;--tbb:24px;
  --fx-brand:0 0 12px rgba(176,134,240,.36);--fx-top:0 -4px 4px rgba(0,0,0,.04);--fx-bottom:0 4px 4px rgba(0,0,0,.04);
}
/* ui-font 텍스트 스타일 */
.t-heading-lg{font-size:28px;font-weight:700;line-height:1.2}
.t-heading-md{font-size:24px;font-weight:700;line-height:1.2}
.t-subtitle-lg{font-size:20px;font-weight:700;line-height:1.2}
.t-subtitle-md{font-size:16px;font-weight:700;line-height:1.2}
.t-subtitle-sm{font-size:14px;font-weight:600;line-height:1.2}
.t-body-md{font-size:16px;font-weight:500;line-height:1.5}
.t-body-sm{font-size:14px;font-weight:400;line-height:1.5}
.t-caption-lg{font-size:13px;font-weight:500;line-height:1.4}
.t-caption-md{font-size:12px;font-weight:400;line-height:1.4}
body{margin:0;background:#fff}
/* 웹 버전: 실제 폰 브라우저에서는 목업용 상태바(54px)·홈바(44/34px) 여백을 제거 */
@media (max-width: 500px) and (pointer: coarse){
  :root{--sb:env(safe-area-inset-top,0px);--hb:calc(16px + env(safe-area-inset-bottom,0px));--hb34:calc(16px + env(safe-area-inset-bottom,0px));--tbb:calc(8px + env(safe-area-inset-bottom,0px))}
}
/* 웹 버전: 앱 화면을 브라우저 가운데에 배치 */
body{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh}
/* 어떤 화면에서 열어도 세로를 꽉 채움 (100dvh 미지원 브라우저는 100vh) */
@supports not (height: 100dvh){.app{height:100vh !important}}
/* 웹에서 스크롤바 숨김 (스크롤 동작은 유지) */
html,body{overflow:hidden}
html,body,.app,.app *{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.app::-webkit-scrollbar,.app *::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#9A6BE3}a:hover{color:#7d4fd0}
.app,.app *{box-sizing:border-box}
.app{-webkit-font-smoothing:antialiased;letter-spacing:0}
:where(.app) :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
:where(.app) :where(input,textarea){font:inherit;letter-spacing:inherit}
:where(.app) :where(img){display:block}
.pre-hide{visibility:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;position:relative}
.scroll::-webkit-scrollbar{display:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 24px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start;scroll-margin-left:24px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll{cursor:grab;-webkit-user-select:none;user-select:none}
.hscroll.drag{cursor:grabbing;scroll-snap-type:none}
.hscroll.drag *{pointer-events:none}
.nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:#272727;flex:none}
.iconbtn:hover{background:rgba(0,0,0,.04)}
.navtitle{font-size:20px;font-weight:700;line-height:1.2;color:#272727;flex:1;text-align:center;min-width:0}
.btn{height:52px;border-radius:12px;display:flex !important;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:600;line-height:1;width:100%;text-align:center !important}
.btn-primary{background:#B086F0;color:#fff !important}
.btn-primary:hover{background:#9A6BE3}
.btn-primary:disabled{background:#EAE9EC;color:#A4A3A6 !important;cursor:default}
.btn-sub{background:#EAE9EC;color:#5E5D60 !important}
.badge{flex:none;width:22px;height:22px;border-radius:11px;border:1px solid #D7A6FF;color:#9A6BE3;font-size:12px;font-weight:400;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.sec-title{font-size:20px;font-weight:700;color:#272727;margin:0;line-height:1.2}
.sec-sub{font-size:13px;font-weight:500;line-height:1.4;color:#7C7B7E;margin:6px 0 0}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#7C7B7E;line-height:1.4;min-width:0}
.meta svg{flex:none;color:#A4A3A6}
.row-card{display:flex;gap:14px;width:100%;align-items:flex-start}
.row-card img{width:92px;height:123px;object-fit:cover;border-radius:4px;flex:none;background:#EAE9EC}
.row-card .t{font-size:16px;font-weight:500;color:#272727;line-height:1.5;margin:2px 0 10px}
.ellip2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ellip3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ellip1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{font-size:16px;letter-spacing:1px;line-height:1}
.stars .f{color:#FFCA42}.stars .e{color:#D6D5D8}
.pill{height:40px;border-radius:20px;background:#EAE9EC;color:#5E5D60;font-size:16px;font-weight:400;line-height:1;display:flex !important;align-items:center;justify-content:center;border:1.5px solid transparent !important;padding:0 16px !important;text-align:center !important}
.pill.on{background:#F7EFFF;border-color:#B086F0 !important;color:#9A6BE3;font-weight:600}
.cat{flex:1;height:46px;display:flex !important;align-items:center;justify-content:center;font-size:16px;font-weight:400;line-height:1;color:#7C7B7E;border-bottom:1px solid #EAE9EC !important}
.cat.on{background:#B086F0;color:#fff;border-color:#B086F0 !important;font-weight:600}
.utab{flex:1;height:48px;display:flex !important;align-items:center;justify-content:center;font-size:16px;font-weight:400;line-height:1;color:#7C7B7E;border-bottom:2px solid #EAE9EC !important;text-decoration:none}
.utab.on{color:#9A6BE3;border-color:#B086F0 !important;font-weight:600}
.utab.auto{flex:none;padding:0 12px;margin-bottom:-1px;border-bottom-color:transparent !important}
.utab.auto.on{border-bottom-color:#B086F0 !important}
.utab:hover{color:#9A6BE3}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(64px + var(--tbb));background:#fff;border-radius:24px 24px 0 0;box-shadow:var(--fx-top);display:flex;justify-content:space-around;padding:8px 24px 0;z-index:20}
.tab{width:96px;height:56px;border-radius:16px;display:flex !important;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:400;line-height:1.4;color:#5E5D60}
.tab.on{background:#F7EFFF;color:#9A6BE3;font-weight:600}
.divider{height:8px;background:#F8F7F9}
.info-row{display:flex;padding:10px 24px;font-size:16px;font-weight:500;line-height:1.5}
.info-row .k{width:100px;flex:none;color:#7C7B7E}
.info-row .v{color:#272727;flex:1;min-width:0}
.chk{display:inline-flex;align-items:center;gap:4px;margin:0 12px 6px 0;color:#272727}
.chk svg{color:#B086F0}
.review{border:1px solid #EAE9EC !important;border-radius:12px;padding:16px !important;background:#fff;display:flex !important;flex-direction:column;gap:10px;width:100%}
.overlay{position:absolute;inset:0;background:rgba(20,18,26,.45);z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:12px 20px var(--hb34)}
.grab{width:40px;height:4px;border-radius:2px;background:#D6D5D8;margin:0 auto 16px}
.modal-wrap{position:absolute;inset:0;background:rgba(20,18,26,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:0 32px}
.modal{background:#fff;border-radius:20px;padding:28px 20px 20px;width:100%;text-align:center}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(39,39,39,.92);color:#fff;font-size:14px;line-height:1.5;padding:12px 18px;border-radius:24px;z-index:70;white-space:nowrap}
.track{display:flex;width:1179px;height:100%;transition:transform .5s ease}
.bnr{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.bnr.drag{cursor:grabbing}.bnr.drag .track{transition:none}
.bnr img{-webkit-user-drag:none;pointer-events:none}
.track.t0{transform:translateX(0)}.track.t1{transform:translateX(-393px)}.track.t2{transform:translateX(-786px)}
.slide{width:393px;height:100%;position:relative;overflow:hidden;flex:none;display:block !important}
.dot{width:6px;height:6px;border-radius:10px;background:rgba(255,255,255,.25)}
.dot.on{width:16px;background:rgba(255,255,255,.8)}
.btxt{position:absolute;left:0;right:0;bottom:0;opacity:0;transition:opacity .4s ease}
.btxt.on{opacity:1}
.hdr{position:absolute;top:0;left:0;right:0;height:calc(54px + var(--sb));padding:var(--sb) 8px 0 24px;z-index:10;display:flex;align-items:center;justify-content:space-between;transition:background .2s}
.hdr.solid{background:#fff;box-shadow:var(--fx-bottom)}
.hdr .logo{width:120px;height:auto;filter:brightness(0) invert(1)}
.hdr.solid .logo{filter:none}
.hdr .bell{color:#fff}
.hdr.solid .bell{color:#272727}
.status{height:35px;padding:0 18px;border-radius:18px;font-size:14px;font-weight:600;line-height:1.2;color:#fff;display:inline-flex;align-items:center}
.st-soon{background:#709FF6}.st-on{background:#B086F0}.st-open{background:#9A6BE3}.st-end{background:#A4A3A6}
.field{width:100%;height:48px;border-radius:10px;background:#F8F7F9;border:1px solid #EAE9EC;padding:0 16px;font-size:16px;font-weight:400;color:#272727;outline:none}
.field:focus{border-color:#B086F0;background:#fff}
.field::placeholder{color:#A4A3A6}
.seg{flex:1;display:flex !important;align-items:center;gap:8px;height:52px;padding:0 16px !important;color:#7C7B7E;font-size:16px;font-weight:400}
.seg svg{color:#A4A3A6}
.seg.on svg{color:#000000}
.kb{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#D3D5DB;padding:8px 3px 0;box-shadow:0 -1px 0 rgba(0,0,0,.06)}
.kb-row{display:flex;justify-content:center;gap:6px;margin-bottom:11px;padding:0 0}
.kb-key{flex:1;max-width:33px;height:42px;border-radius:5px;background:#fff;box-shadow:0 1px 0 #898A8D;display:flex !important;align-items:center;justify-content:center;font-size:22px;font-weight:400;color:#000;text-align:center !important;font-family:-apple-system,'Apple SD Gothic Neo','Pretendard Variable',sans-serif;user-select:none}
.kb-key:active{background:#BFC3CB}
.kb-key.fn{background:#ABB0BA;max-width:42px;flex:none;width:42px;font-size:16px}
.kb-key.fn.on{background:#fff}
.kb-key.mode{background:#ABB0BA;max-width:none;flex:none;width:88px;font-size:16px}
.kb-key.space{max-width:none;flex:1;font-size:16px}
.kb-key.go{background:#007AFF;color:#fff;max-width:none;flex:none;width:88px;font-size:16px}
.kb-key.go.off{background:#ABB0BA;color:#fff}
.kb-bottom{height:44px;display:flex;align-items:flex-start;justify-content:space-between;padding:4px 18px 0;color:#50555C}
.sico{color:#A4A3A6}
.sico.on{color:#000000}
.seg.on{color:#000000}
.sbox input{caret-color:#B086F0}
.sbox input::placeholder{color:#7C7B7E}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:8px;justify-items:center}
.cal-w{font-size:16px;font-weight:500;line-height:1.5;color:#5E5D60;height:32px;display:flex;align-items:center}
.cal-d{width:40px;height:40px;border-radius:20px;display:flex !important;align-items:center;justify-content:center;font-size:16px;line-height:1;color:#2C2B2E;text-align:center !important;border:1.5px solid transparent !important}
.cal-d:hover{background:#F7EFFF}
.cal-d.today{border-color:#B086F0 !important;color:#9A6BE3}
.cal-d.sel{background:#B086F0;color:#fff;font-weight:600}
.cal-nav{width:40px;height:40px;display:flex !important;align-items:center;justify-content:center;border-radius:20px;color:#2C2B2E}
.cal-nav:hover{background:#F8F7F9}
.fchip{height:32px;border-radius:20px;border:1.5px solid #A4A3A6 !important;padding:0 12px 0 16px !important;display:inline-flex !important;align-items:center;gap:4px;font-size:16px;font-weight:400;line-height:1;color:#919193}
.fchip.on{border-color:#2C2B2E !important;color:#2C2B2E}
.wstar{width:52px;height:52px;display:flex !important;align-items:center;justify-content:center;color:#EAE9EC}
.wstar.on{color:#FFCA42}
.scr-in{animation:fadein .22s ease}
@keyframes fadein{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:none}}
.anchor{scroll-margin-top:52px}
.vendor{height:56px;border:1px solid #EAE9EC;border-radius:28px;display:flex;align-items:center;gap:10px;padding:0 8px 0 8px}
.vlogo{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.smallbtn{height:36px;padding:0 16px !important;border-radius:18px;background:#EAE9EC;color:#5E5D60;font-size:14px;font-weight:600;line-height:1}
.smallbtn:hover{background:#EAE9EC}
.mono-logo{width:100px;filter:grayscale(1);opacity:.45}
.pwrap{position:relative;flex:none;display:block}
.pbadge{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,.92);border:1px solid #D7A6FF;color:#9A6BE3;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
</style>
</helmet>

<!-- ===================== ONBOARDING: LOCATION ===================== -->
<sc-if value="{{isLoc}}" hint-placeholder-val="{{ false }}">
<div class="scr scr-in" style="padding-top: var(--sb)">
<div class="nav" style="box-shadow: 0 1px 0 #EAE9EC">

<div class="scroll" style="padding-bottom: 24px">
<div style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 32px">
<span style="width: 24px; height: 24px; border-radius: 12px; background: #B086F0; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: #EAE9EC"></span>

    const wDisabled = !(s.wStars > 0 && s.wText.trim().length > 0);

    const rowsSrc = s.kbNum ? KB_NUM.map((r) => r.split('')) : KB_KO.map((r) => (s.kbShift ? r[1] : r[0]).split(''));

      { pad: 0, keys: rowsSrc[0].map(typeKey) },
      { pad: s.kbNum ? 0 : 18, keys: rowsSrc[1].map(typeKey) },
      { pad: 0, keys: [s.kbNum ? key('#+=', () => {}, 'fn', '기호') : key('⇧', () => set({ kbShift: !s.kbShift }), 'fn' + (s.kbShift ? ' on' : ''), 'Shift')].concat(rowsSrc[2].map(typeKey), [key('⌫', () => set({ q: s.kbNum ? s.q.slice(0, -1) : backJamo(s.q) }), 'fn', '지우기')]) },
      { pad: 0, keys: [key(s.kbNum ? 'ㄱㄴㄷ' : '123', () => set({ kbNum: !s.kbNum, kbShift: false }), 'mode', s.kbNum ? '한글' : '숫자'), key('스페이스', () => set({ q: s.q + ' ' }), 'space', '스페이스'), key('검색', submit, 'go' + (canGo ? '' : ' off'), '검색')] }

    const calFor = (v) => { const d = v ? new Date(+v.slice(0, 4), +v.slice(5, 7) - 1, 1) : new Date(); return { calY: d.getFullYear(), calM: d.getMonth() }; };

      withdraw: { title: '정말 탈퇴하시겠어요?', body: '작성한 후기와 찜한 공연이\n모두 삭제되며 복구할 수 없어요.', cta: '탈퇴하기', confirm: () => { set({ modal: null, sheet: null, screen: 'login', reviews: s.reviews.filter((r) => !r.mine), wish: {}, nickFinal: '', nick: '', region: '' }); this.showToast('회원탈퇴가 완료되었어요'); } },
      delete: { title: '후기를 삭제하시겠어요?', body: '삭제한 후기는 복구할 수 없어요.', cta: '삭제하기', confirm: () => { set({ modal: null, reviews: s.reviews.filter((r) => r.id !== s.pendingDelete), pendingDelete: null }); this.showToast('후기가 삭제되었어요'); } }

    return {

      isHome: s.screen === 'home', isSearch: s.screen === 'search', isDetail: s.screen === 'detail', isWrite: s.screen === 'write', isMy: s.screen === 'my',
      showTabbar: ['home', 'my'].indexOf(s.screen) >= 0,
      showLoading: !ready && ['home', 'search', 'detail', 'write', 'my'].indexOf(s.screen) >= 0,
      loadingMsg: s.loadError || 'KOPIS 공연 정보를 불러오는 중이에요',
      fetchedAt: FETCHED, boxRange: '2026.11.11 ~ 11.17', topCats,
      tabHome: s.screen === 'home' ? 'on' : '', tabSearch: s.screen === 'search' ? 'on' : '', tabMy: s.screen === 'my' ? 'on' : '',
      // nav
      toLogin: () => set({ screen: 'login' }),
      toLoc: () => set({ screen: 'loc' }),
      toNick: () => set({ screen: 'nick' }),
      toHome: () => set({ screen: 'home', sheet: null, scrolled: false }),
      toSearch: () => set({ screen: 'search', sheet: null, submitted: false, kbOpen: false }),
      toMy: () => set({ screen: 'my', sheet: null }),
      // onboarding
      locRegions: regionGrid(s.region, (r) => set({ region: r })),
      locDisabled: !s.region,
      nick: s.nick, hasNick: n.length > 0, nickMsg, hasNickMsg: !!nickMsg, nickErr: nickState === 'err', nickOk: nickState === 'ok',
      nickColor, nickLine, nickDisabled: nickState !== 'ok',
      onNick: (e) => set({ nick: e.target.value }),
      clearNick: () => set({ nick: '' }),
      finishOnboarding: () => { set({ nickFinal: s.nick, screen: 'home', scrolled: false }); this.showToast(s.nick + '님, 환영해요!'); },
      // home
      hdrCls: s.scrolled ? 'solid' : '',
      onHomeScroll: (e) => { const sc = e.currentTarget.scrollTop > 430; if (sc !== s.scrolled) set({ scrolled: sc }); },
      onBell: () => this.showToast('새로운 알림이 없어요'),
      banner: s.banner, slides, dots, homeReviews, homeCats, nearList, nearEmpty: nearList.length === 0, homeSections: sections,
      regionLabel: s.region || '대구',
      openHomeRegion: () => set({ sheet: 'homeRegion' }),
      homeRegions: regionGrid(s.region || '대구', (r) => set({ region: r, sheet: null })),
      // search
      q: s.q, searching, searchIdle: !searching,
      onQ: (e) => set({ q: e.target.value }),
      onQKey: (e) => { if (e.key === 'Enter') submit(); },
      kbOpen: s.screen === 'search' && s.kbOpen && !s.sheet, kbRows, kbHold: (e) => e.preventDefault(), kbShow: () => { if (!s.kbOpen) set({ kbOpen: true }); },
      kbHide: () => { if (s.kbOpen) set({ kbOpen: false }); },
      bnDown: (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const el = e.currentTarget; this._bn = { x: e.clientX, y: e.clientY, moved: false, el, id: e.pointerId };
      },
      bnMove: (e) => {
        const d = this._bn; if (!d) return;
        const dx = e.clientX - d.x, dy = e.clientY - d.y;
        if (!d.moved) {
          if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) { this._bn = null; return; }
          if (Math.abs(dx) > 6) { d.moved = true; d.el.classList.add('drag'); try { d.el.setPointerCapture(d.id); } catch (err) {} }
        }
        if (d.moved) {
          const i = this.state.banner, edge = (i === 0 && dx > 0) || (i === 2 && dx < 0);
          const track = d.el.firstElementChild; if (track) track.style.transform = 'translateX(' + (-393 * i + (edge ? dx / 3 : dx)) + 'px)';
        }
      },
      bnUp: (e) => {
        const d = this._bn; this._bn = null; if (!d) return;
        const track = d.el.firstElementChild;
        d.el.classList.remove('drag'); if (track) track.style.transform = '';
        if (!d.moved) return;
        d.el._justDragged = true; setTimeout(() => { d.el._justDragged = false; }, 50);
        const dx = e.clientX - d.x, i = this.state.banner;
        const next = dx < -60 ? Math.min(2, i + 1) : dx > 60 ? Math.max(0, i - 1) : i;
        if (next !== i) this.setState({ banner: next });
        this.startBanner();
      },
      bnClick: (e) => { if (e.currentTarget._justDragged) { e.preventDefault(); e.stopPropagation(); } },
      hsDown: (e) => { if (e.button !== 0) return; const el = e.currentTarget; el._d = { x: e.clientX, l: el.scrollLeft, moved: false }; },
      hsMove: (e) => { const el = e.currentTarget, d = el._d; if (!d) return; const dx = e.clientX - d.x; if (Math.abs(dx) > 4) { d.moved = true; el.classList.add('drag'); } if (d.moved) el.scrollLeft = d.l - dx; },
      hsUp: (e) => { const el = e.currentTarget, d = el._d; if (!d) return; el._d = null; el.classList.remove('drag'); if (d.moved) { el._justDragged = true; setTimeout(() => { el._justDragged = false; }, 50); } },
      hsClick: (e) => { if (e.currentTarget._justDragged) { e.preventDefault(); e.stopPropagation(); } },
      clearQ: () => set({ q: '', submitted: false, kbOpen: false }), clearQText: () => set({ q: '' }),
      hasRecent: s.recent.length > 0, recentChips, topList,
      emptyHint: (s.sDate || s.sRegion) ? '필터를 바꾸거나 초기화해보세요' : '다른 공연명으로 검색해보세요',
      searchCats, results, resultCount: results.length, noResults: results.length === 0,
      sDateLabel: s.sDate ? s.sDate.slice(2).replace(/\./g, '/') : '날짜', sRegionLabel: s.sRegion || '지역',
      sboxCls: '', kwCls: s.qFocus ? 'on' : '', qFocusOn: () => set({ qFocus: true }), qFocusOff: () => set({ qFocus: false }),
      sDateCls: (sheetOpen && s.fTab === 'date') || s.sDate ? 'on' : '', sRegionCls: (sheetOpen && s.fTab === 'region') || s.sRegion ? 'on' : '',
      calTitle: s.calY + '년 ' + (s.calM + 1) + '월', calDays, weekNames: WEEK.map((w) => ({ label: w })), calPrev: moveCal(-1), calNext: moveCal(1),
      openDateSheet: () => set(Object.assign({ sheet: 'filter', fTab: 'date', fDate: s.sDate, fRegion: s.sRegion }, calFor(s.sDate))),
      openRegionSheet: () => set({ sheet: 'filter', fTab: 'region', fDate: s.sDate, fRegion: s.sRegion }),
      sheetFilter: s.sheet === 'filter', fIsDate: s.fTab === 'date', fIsRegion: s.fTab === 'region',
      fTabDate: () => set({ fTab: 'date' }), fTabRegion: () => set({ fTab: 'region' }),
      fDateColor: s.fTab === 'date' ? '#272727' : '#A4A3A6', fDateLine: s.fTab === 'date' ? '#272727' : 'transparent',
      fRegionColor: s.fTab === 'region' ? '#272727' : '#A4A3A6', fRegionLine: s.fTab === 'region' ? '#272727' : 'transparent',
      filterRegions: regionGrid(s.fRegion, (r) => set({ fRegion: s.fRegion === r ? '' : r })),
      resetFilter: () => set({ fDate: '', fRegion: '', sDate: '', sRegion: '' }),
      applyFilter: () => { const has = !!(s.fDate || s.fRegion); set({ sDate: s.fDate, sRegion: s.fRegion, sheet: null, kbOpen: has && !s.submitted ? true : s.kbOpen }); if (has && !s.submitted) setTimeout(() => { const el = document.getElementById('q1'); if (el) el.focus(); }, 80); },
      // sheets
      sheetHomeRegion: s.sheet === 'homeRegion', sheetSettings: s.sheet === 'settings',
      closeSheet: () => set({ sheet: null }),
      // detail
      d, wished, wishLabel: wished ? '찜 해제' : '찜하기',
      heartFill: wished ? 'currentColor' : 'none', heartColor: wished ? '#FA6363' : '#272727',
      toggleWish: () => { set({ wish: Object.assign({}, s.wish, { [base.id]: !wished }) }); this.showToast(wished ? '찜을 해제했어요' : '찜한 공연에 추가했어요'); },
      detailBack: () => set({ screen: s.prev || 'home' }),
      tInfo: s.dTab === 'info' ? 'on' : '', tTicket: s.dTab === 'ticket' ? 'on' : '', tReview: s.dTab === 'review' ? 'on' : '',
      onDetailScroll: (e) => {
        const el = e.currentTarget, y = el.scrollTop + 60;
        const pos = (id) => { const n = el.querySelector('#' + id); return n ? n.offsetTop : 1e9; };
        const k = y >= pos('d-review') - 10 || el.scrollTop + el.clientHeight >= el.scrollHeight - 4 ? 'review' : y >= pos('d-ticket') ? 'ticket' : 'info';
        if (k !== s.dTab) set({ dTab: k });
      },
      tabInfo: tabSet('info'), tabTicket: tabSet('ticket'), tabReview: tabSet('review'),
      descH: s.descOpen ? '6000px' : '220px', descClosed: !s.descOpen,
      descLabel: s.descOpen ? '접기' : '전체보기', descRot: s.descOpen ? 'rotate(180deg)' : 'none',
      toggleDesc: () => set({ descOpen: !s.descOpen }),
      dReviews: dRevs, dReviewCount: dRevs.length, dNoReviews: dRevs.length === 0,
      writeLocked: base.status === '오픈예정', writeLabel: base.status === '오픈예정' ? '공연 시작 후 후기를 쓸 수 있어요' : '관람후기 쓰기',
      toWrite: () => set({ screen: 'write', wStars: 0, wPicks: {}, wSeat: '', wText: '' }),
      // write
      writeBack: () => set({ screen: 'detail' }),
      wStarsList,
      wFillW: s.wStars ? 'calc(20px + (100% - 40px) * ' + (s.wStars - 1) / 4 + ')' : '0px',
      wKnobL: 'calc(20px + (100% - 40px) * ' + (Math.max(1, s.wStars) - 1) / 4 + ')', wHasKnob: s.wStars > 0,
      wDots: [1, 2, 3, 4, 5].filter((i) => i > s.wStars).map((i) => ({ left: 'calc(20px + (100% - 40px) * ' + (i - 1) / 4 + ')' })),
      wSlide: (e) => { const r = e.currentTarget.getBoundingClientRect(); const step = (r.width - 40) / 4; const i = Math.max(0, Math.min(4, Math.round((e.clientX - r.left - 20) / step))); set({ wStars: i + 1 }); },
      wGroups, wSeat: s.wSeat, wText: s.wText, wCount: s.wText.length.toLocaleString(),
      onSeat: (e) => set({ wSeat: e.target.value }),
      onText: (e) => set({ wText: e.target.value.slice(0, 1000) }),
      wDisabled,
      submitReview: () => {
        if (wDisabled) return;
        const tags = Object.keys(s.wPicks).filter((k) => s.wPicks[k]).map((k) => k.split(':')[1]);

      },
      // my
      nickname, intro: '대학로 소극장을 사랑하는 관객입니다.\n요즘은 창작 뮤지컬에 빠져 있어요.',
      wishCount: wishList.length, myReviewCount: myRevs.length,
      myTabReview: s.myTab === 'review' ? 'on' : '', myTabWish: s.myTab === 'wish' ? 'on' : '',

      showMyReviews: s.myTab === 'review', showMyWish: s.myTab === 'wish',
      myReviews: myRevs, noMyReviews: myRevs.length === 0, wishList, noWish: wishList.length === 0,
      openSettings: () => set({ sheet: 'settings' }),
      onProfileEdit: () => { set({ sheet: null }); this.showToast('프로필 설정은 준비 중이에요'); },
