<div class="divider"></div>
<section id="d-ticket" class="anchor" style="padding: 12px 0 16px">
<h2 style="margin: 0; padding: 14px 24px 8px; font-size: 20px; font-weight: 700; line-height: 1.2">티켓예매</h2>
<div class="info-row"><span class="k">티켓금액</span>
<div class="v" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{d.prices}}" as="p" hint-placeholder-count="1">
<div><span style="font-size: 13px; font-weight: 700; color: #9A6BE3; display: inline-block; min-width: 40px">{{p.grade}}</span> {{p.price}}</div>
</sc-for>
<sc-if value="{{d.noPrice}}" hint-placeholder-val="{{ false }}"><span style="color: #7C7B7E">예매처에서 확인해주세요</span></sc-if>
</div>
</div>
<div class="info-row"><span class="k">판매처</span>
<div class="v" style="display: flex; flex-direction: column; gap: 8px; padding-top: 2px">
<sc-for list="{{d.vendors}}" as="v" hint-placeholder-count="2">
<div class="vendor">
<span class="vlogo" style="background: {{v.bg}}; color: {{v.fg}}">{{v.mark}}</span>
<span class="ellip1" style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600">{{v.name}}</span>
<a class="smallbtn" href="{{v.url}}" target="_blank" rel="noopener" aria-label="{{v.aria}}" style="display: inline-flex; align-items: center; text-decoration: none">이동</a>
</div>
</sc-for>
<sc-if value="{{d.noVendor}}" hint-placeholder-val="{{ false }}"><span style="color: #7C7B7E">등록된 예매처가 없어요</span></sc-if>
</div>
</div>
</section>
<div class="divider"></div>
<section id="d-review" class="anchor" style="padding: 12px 24px 32px">
<h2 style="margin: 0; padding: 14px 0 16px; font-size: 20px; font-weight: 700; line-height: 1.2">관람후기({{dReviewCount}})</h2>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{dReviews}}" as="r" hint-placeholder-count="3">
<article class="review">
<div style="display: flex; align-items: center; gap: 10px">
<sc-if value="{{r.mine}}" hint-placeholder-val="{{ true }}"><img src="./assets/image-a3c5.jpg" alt="" style="width: 36px; height: 36px; border-radius: 18px; object-fit: cover"></sc-if>
<sc-if value="{{r.other}}" hint-placeholder-val="{{ false }}"><span style="width: 36px; height: 36px; border-radius: 18px; background: {{r.avBg}}; color: #ffffff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.initial}}</span></sc-if>
<div style="flex: 1; min-width: 0">
<div style="font-size: 13px; color: #5E5D60">{{r.author}} <span style="color: #A4A3A6; margin-left: 4px">{{r.date}}</span></div>
<div class="stars" style="margin-top: 4px"><span class="f">{{r.full}}</span><span class="e">{{r.empty}}</span></div>
</div>
<sc-if value="{{r.mine}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; color: #9A6BE3; background: #F7EFFF; border-radius: 10px; padding: 3px 8px">내 후기</span></sc-if>
</div>
<p class="ellip3" style="margin: 0; font-size: 14px; line-height: 1.55; color: #2C2B2E">{{r.text}}</p>
<sc-if value="{{r.hasTags}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2"><span style="font-size: 12px; color: #9A6BE3; background: #F7EFFF; border-radius: 12px; padding: 4px 10px">#{{t.label}}</span></sc-for>
</div>
</sc-if>
</article>
</sc-for>
<sc-if value="{{dNoReviews}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 0 12px; color: #7C7B7E">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#C2C1C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
<p style="margin: 0; font-size: 16px">아직 작성된 관람후기가 없어요</p>
<p style="margin: 0; font-size: 13px">첫 번째 후기를 남겨보세요!</p>
</div>
</sc-if>
</div>
</section>

<div style="background: #F8F7F9; padding: 28px 24px calc(40px + 76px + var(--hb34)); display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 100vh 0 100vh #F8F7F9">
<img class="mono-logo" src="./assets/logo.png" alt="내안의연뮤">
<p style="margin: 0; font-size: 12px; line-height: 1.4; color: #7C7B7E; text-align: center">공연정보 출처<br>(재)예술경영지원센터 공연예술통합전산망</p>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 24px var(--hb34); background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #ffffff 35%); z-index: 8">
<button class="btn btn-primary" onClick="{{toWrite}}" disabled="{{writeLocked}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>{{writeLabel}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{isWrite}}" hint-placeholder-val="{{ false }}">

</sc-for>
</div>

<span style="position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: #EAE9EC"></span>
<span style="position: absolute; left: 0; top: 18px; height: 8px; border-radius: 4px; background: #B086F0; width: {{wFillW}}"></span>

<span style="position: absolute; top: 8px; left: {{wKnobL}}; width: 28px; height: 28px; margin-left: -14px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 2px #B086F0"></span>

</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">

</div>
</sc-for>
<div style="padding: 28px 24px 4px">

</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 24px var(--hb34); background: #ffffff; box-shadow: var(--fx-top)">

      kbHide: () => { if (s.kbOpen) set({ kbOpen: false }); },
      bnDown: (e) => {

      hsUp: (e) => { const el = e.currentTarget, d = el._d; if (!d) return; el._d = null; el.classList.remove('drag'); if (d.moved) { el._justDragged = true; setTimeout(() => { el._justDragged = false; }, 50); } },
      hsClick: (e) => { if (e.currentTarget._justDragged) { e.preventDefault(); e.stopPropagation(); } },
